apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-benevoles-isolation
spec:
  podSelector:
    matchLabels:
      app: db-benevoles
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: service-benevoles
      ports:
        - protocol: TCP
          port: 5432
