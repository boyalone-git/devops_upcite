apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-benevoles-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-benevoles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-benevoles
  template:
    metadata:
      labels:
        app: db-benevoles
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: benevoles_db
            - name: POSTGRES_USER
              value: user_dev
            - name: POSTGRES_PASSWORD
              value: password_dev
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-benevoles-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db-benevoles
spec:
  selector:
    app: db-benevoles
  ports:
    - port: 5432
      targetPort: 5432
