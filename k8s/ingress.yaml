apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solidarite-gateway
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: solidarite-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /api/benevoles
            pathType: Prefix
            backend:
              service:
                name: service-benevoles
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-annuaire
                port:
                  number: 8080
